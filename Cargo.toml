[package]
name = "lens"
version = "0.1.0"
edition = "2024"
authors = ["mnkz"]
description = "Freeze both screens from the Windows tray"
license = "MIT"
repository = "https://github.com/mnkz/lens"
readme = "README.md"
keywords = ["windows", "tray", "screenshot", "ocr"]
categories = ["gui"]

[dependencies]
chrono = { version = "0.4.45", features = ["clock"] }
eframe = "0.37.0"
png = "0.17.16"
raw-window-handle = "0.6"
tray-icon = "0.26.1"
wry = "0.51.2"
windows = { version = "0.61.3", features = [
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_System_WinRT",
] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 16
lto = false
